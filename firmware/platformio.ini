[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16MB flash, 8MB octal PSRAM
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
	-DBOARD_HAS_PSRAM
	-DCONFIG_SPIRAM_MODE_OCT
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLED_PIN_A=48
	-DLED_PIN_B=38
	-DLED_COUNT=1
	; TMC2209 v1.3, one driver per axis. UART TX is reserved but not yet driven;
	; the drivers run on their strap defaults for now.
	-DAXIS_X_EN=13
	-DAXIS_X_TX=12
	-DAXIS_X_STEP=11
	-DAXIS_X_DIR=9
	-DAXIS_Y_EN=7
	-DAXIS_Y_TX=6
	-DAXIS_Y_STEP=5
	-DAXIS_Y_DIR=4

monitor_speed = 115200

lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.3
	bblanchon/ArduinoJson@^7.2.0
