name: mobile-release

on:
  push:
    tags: ['mobile-v*']

permissions:
  contents: write # create the GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode release keystore
        run: echo "$HORUS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          HORUS_KEYSTORE_BASE64: ${{ secrets.HORUS_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          HORUS_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          HORUS_KEYSTORE_PASSWORD: ${{ secrets.HORUS_KEYSTORE_PASSWORD }}
          HORUS_KEY_ALIAS: ${{ secrets.HORUS_KEY_ALIAS }}
          HORUS_KEY_PASSWORD: ${{ secrets.HORUS_KEY_PASSWORD }}
        run: |
          V="${GITHUB_REF_NAME#mobile-v}"
          ./gradlew --no-daemon assembleRelease \
            -PversionName="$V" \
            -PversionCode="${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/horus-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: horus-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
